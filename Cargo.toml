[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "apps/cli",
    "crates/binaris-core",
    "crates/binaris-analysis",
    "crates/binaris-ai",
    "crates/binaris-db",
    "crates/binaris-storage",
    "crates/binaris-auth",
    "crates/binaris-reports",
    "crates/binaris-graphs",
    "crates/binaris-malware",
    "crates/binaris-security",
    "crates/binaris-pipeline",
    "crates/binaris-decomp",
    "crates/binaris-network",
    "crates/binaris-diff",
    "sdks/rust",
]
default-members = ["apps/api", "apps/worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Binaris Engineering"]
repository = "https://github.com/binaris-hq/binaris"
rust-version = "1.88"

[workspace.dependencies]
binaris-core = { path = "crates/binaris-core" }
binaris-analysis = { path = "crates/binaris-analysis" }
binaris-ai = { path = "crates/binaris-ai" }
binaris-db = { path = "crates/binaris-db" }
binaris-storage = { path = "crates/binaris-storage" }
binaris-auth = { path = "crates/binaris-auth" }
binaris-reports = { path = "crates/binaris-reports" }
binaris-graphs = { path = "crates/binaris-graphs" }
binaris-malware = { path = "crates/binaris-malware" }
binaris-security = { path = "crates/binaris-security" }
binaris-pipeline = { path = "crates/binaris-pipeline" }
binaris-decomp = { path = "crates/binaris-decomp" }
binaris-network = { path = "crates/binaris-network" }
binaris-diff = { path = "crates/binaris-diff" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures = "0.3"
goblin = "0.9"
hex = "0.4"
hmac = "0.12"
http = "1"
jsonwebtoken = "9"
md-5 = "0.10"
object = { version = "0.36", features = ["all"] }
once_cell = "1"
opentelemetry = "0.27"
opentelemetry-otlp = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
parking_lot = "0.12"
petgraph = "0.6"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "compression-gzip", "request-id", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
walkdir = "2"
zip = "2"
flate2 = "1"
byteorder = "1"
capstone = "0.12"
entropy = "0.4"
infer = "0.16"
memchr = "2"
rayon = "1"
tempfile = "3"
toml = "0.8"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
argon2 = "0.5"
sha3 = "0.10"
blake3 = "1"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 0
