apiVersion: apps/v1
kind: Deployment
metadata:
  name: binaris-api
  labels:
    app: binaris-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: binaris-api
  template:
    metadata:
      labels:
        app: binaris-api
    spec:
      containers:
        - name: api
          image: binaris-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: binaris-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: binaris-api
spec:
  selector:
    app: binaris-api
  ports:
    - port: 80
      targetPort: 8080
